<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004578;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring (Chrome-like Segments) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <path d="M256,40 C375.29,40 472,136.71 472,256 C472,375.29 375.29,472 256,472 C136.71,472 40,375.29 40,256 C40,136.71 136.71,40 256,40 Z" fill="url(#blueGrad)"/>
  
  <!-- Stylized Eagle (Negative Space/White) -->
  <path d="M256,120 L300,180 L400,180 L320,240 L360,340 L256,280 L152,340 L192,240 L112,180 L212,180 Z" fill="white" opacity="0.9"/>
  
  <!-- Eagle Head Detail -->
  <path d="M256,120 C256,120 270,140 270,160 C270,180 256,190 256,190 C256,190 242,180 242,160 C242,140 256,120 256,120 Z" fill="#004578"/>
  
  <!-- Chrome Shine Overlay -->
  <circle cx="256" cy="256" r="240" fill="url(#chromeGrad)"/>
  
  <!-- Biometric Accent (Scanner lines) -->
  <path d="M180,380 Q256,350 332,380" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M200,410 Q256,390 312,410" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
